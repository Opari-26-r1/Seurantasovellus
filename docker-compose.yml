services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: seuranta_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: seuranta_backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./seuranta-app
    container_name: seuranta_frontend
    env_file:
      - ./seuranta-app/.env
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
